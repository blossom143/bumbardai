version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:24.0
    working_directory: ~/repo

commands:
  setup-pnpm:
    description: "Install pnpm, configure cache, and install dependencies"
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: |
            sudo npm install --global pnpm@11.25.0
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          name: Restore pnpm store cache
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          name: Save pnpm store cache
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

jobs:
  check-format:
    executor: node-executor
    steps:
      - setup-pnpm
      - run:
          name: Check formatting (Prettier)
          command: pnpm format:check

  typecheck:
    executor: node-executor
    steps:
      - setup-pnpm
      - run:
          name: Generate Prisma client & build packages
          command: pnpm build
      - run:
          name: Run TypeScript checks
          command: pnpm typecheck

  unit-test:
    executor: node-executor
    steps:
      - setup-pnpm
      - run:
          name: Generate Prisma client & build packages
          command: pnpm build
      - run:
          name: Run API tests
          command: pnpm test

  validate-manifests:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install kubectl
          command: |
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
      - run:
          name: Validate Flux and Kubernetes Kustomizations
          command: |
            echo "Validating deploy/flux..."
            kubectl kustomize deploy/flux > /dev/null

            for component in storage storage-gke migrate app app-cloudflare catalog; do
              echo "Validating deploy/kubernetes/$component..."
              kubectl kustomize "deploy/kubernetes/$component" > /dev/null
            done

  build-and-push-image:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Set up Docker Buildx and QEMU
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --use --name multiarch-builder
            docker buildx inspect --bootstrap
      - run:
          name: Log in to Docker Hub
          command: |
            if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "Error: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set in CircleCI project settings."
              exit 1
            fi
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build and push multi-arch image
          command: |
            SHORT_SHA="${CIRCLE_SHA1:0:7}"
            IMAGE="docker.io/tuguldurdev/bumbardai"
            TAG="git-${SHORT_SHA}"

            mkdir -p /tmp/ci-artifacts

            echo "Building and pushing ${IMAGE}:${TAG} for linux/amd64 and linux/arm64..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${IMAGE}:${TAG}" \
              --metadata-file /tmp/ci-artifacts/build-metadata.json \
              --push .

            # Buildx writes JSON metadata. Fall back to the registry if metadata is unavailable.
            if ! DIGEST=$(python3 - /tmp/ci-artifacts/build-metadata.json <<'PYTHON'
            import json
            import re
            import sys

            with open(sys.argv[1]) as metadata:
                digest = json.load(metadata).get("containerimage.digest", "")
            if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                sys.exit("Build metadata does not contain a valid image digest.")
            print(digest)
            PYTHON
            ); then
              echo "Reading the published digest from the registry..."
              DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE}:${TAG}")
            fi

            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not determine a valid published image digest." >&2
              exit 1
            fi

            echo "Published image digest: ${DIGEST}"
            echo "${DIGEST}" > /tmp/ci-artifacts/digest.txt
      - persist_to_workspace:
          root: /tmp/ci-artifacts
          paths:
            - digest.txt

  promote-gitops:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/ci-artifacts
      - run:
          name: Update image digest in Git and push to main
          command: |
            NEW_DIGEST=$(cat /tmp/ci-artifacts/digest.txt)
            echo "Promoting image digest in deploy/kubernetes/image/kustomization.yaml to: ${NEW_DIGEST}"

            # Update digest in kustomization component
            sed -i -E "s|digest: sha256:[a-f0-9]+|digest: ${NEW_DIGEST}|g" deploy/kubernetes/image/kustomization.yaml

            git config user.name "circleci-bot"
            git config user.email "bot@circleci.com"

            if ! git diff --quiet deploy/kubernetes/image/kustomization.yaml; then
              git add deploy/kubernetes/image/kustomization.yaml
              git commit -m "ci: promote release ${CIRCLE_SHA1:0:7} (${NEW_DIGEST}) [skip ci]"

              if [ -z "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN not set"; exit 1; fi
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
              for i in 1 2 3; do
                git fetch origin main && git rebase origin/main && git push origin HEAD:main && break
                [ "$i" -lt 3 ] || { echo "Failed to push promoted image digest to origin/main after 3 attempts." >&2; exit 1; }
                sleep 5
              done
              echo "Successfully pushed promoted image digest to origin/main."
            else
              echo "deploy/kubernetes/image/kustomization.yaml is already up to date."
            fi

workflows:
  version: 2

  pr-checks:
    jobs:
      - check-format:
          filters:
            branches:
              ignore: main
      - typecheck:
          filters:
            branches:
              ignore: main
      - unit-test:
          filters:
            branches:
              ignore: main
      - validate-manifests:
          filters:
            branches:
              ignore: main

  release-and-promote:
    jobs:
      - check-format:
          filters:
            branches:
              only: main
      - typecheck:
          filters:
            branches:
              only: main
      - unit-test:
          filters:
            branches:
              only: main
      - validate-manifests:
          filters:
            branches:
              only: main
      - build-and-push-image:
          requires:
            - check-format
            - typecheck
            - unit-test
            - validate-manifests
          filters:
            branches:
              only: main
      - promote-gitops:
          requires:
            - build-and-push-image
          filters:
            branches:
              only: main

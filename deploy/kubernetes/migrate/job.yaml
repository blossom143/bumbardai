apiVersion: batch/v1
kind: Job
metadata:
  name: hallway-migrate
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        hallway-quest.io/storage-client: 'true'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: hallway-quest
          command: [pnpm, --filter, '@hallway/api', migrate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hallway-quest-db
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

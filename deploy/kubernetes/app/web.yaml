apiVersion: v1
kind: Service
metadata:
  name: hallway-quest
spec:
  selector:
    app.kubernetes.io/name: hallway-quest
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hallway-quest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hallway-quest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hallway-quest
        hallway-quest.io/storage-client: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: hallway-quest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: hallway-config
            - secretRef:
                name: hallway-quest-optional
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hallway-quest-db
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 768Mi

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hallway-quest
spec:
  ingressClassName: replace-me
  tls:
    - hosts: [hallway.example.com]
      secretName: hallway-tls
  rules:
    - host: hallway.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hallway-quest
                port:
                  name: http

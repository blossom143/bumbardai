apiVersion: apps/v1
kind: Deployment
metadata:
  name: hallway-cloudflare-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hallway-cloudflare-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hallway-cloudflare-tunnel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          command: [cloudflared]
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hallway-cloudflare-tunnel
                  key: TUNNEL_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
